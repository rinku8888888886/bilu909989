<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer - TRC-20</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1e2329;
            --text-secondary: #848e9c;
            --border-color: #eaecef;
            --accent-blue: #1e80ff;
            --btn-next-bg: #a5b4fc;
            --btn-next-text: #ffffff;
            --network-bg: #f5f5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px 20px;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .label {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 16px;
            font-weight: 500;
            display: block;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
        }

        .address-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            text-align: right;
            background: transparent;
            margin-right: 12px;
            font-family: monospace;
        }

        .address-input::placeholder {
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-clear {
            color: var(--text-secondary);
            font-size: 16px;
            margin-right: 4px;
        }

        .network-pill {
            display: inline-flex;
            align-items: center;
            background-color: var(--network-bg);
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 14px;
            color: var(--text-primary);
            cursor: pointer;
            gap: 8px;
        }

        .network-icon {
            width: 16px;
            height: 16px;
            background-color: #eb5757;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .dropdown-arrow {
            font-size: 10px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .amount-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
        }

        .amount-input {
            flex-grow: 1;
            border: none;
            outline: none;
            font-size: 24px;
            color: var(--text-primary);
            background: transparent;
            width: 100%;
        }

        .amount-input::placeholder {
            color: var(--text-secondary);
        }

        .amount-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .currency-label {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .fiat-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            display: block;
        }

        .next-btn-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
        }

        .next-btn {
            width: 100%;
            background-color: var(--btn-next-bg);
            color: var(--btn-next-text);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        .next-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: transparent;
            z-index: 9999;
        }
        .status-bar.active {
            background: linear-gradient(90deg, #f75900, #3b82f6);
            animation: slide 2s infinite ease-in-out;
        }
        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
    </style>
</head>
<body>

    <div class="status-bar" id="statusBar"></div>

    <div class="container">
        <div class="form-group">
            <label class="label">Address or Domain Name</label>
            <div class="input-row">
                <input type="text" class="address-input" id="address" placeholder="Enter Tron (TRX) address" value="TWd2zR4V1dFvJbXJZv3zQy4Xz5Zy6Zy7Z8">
                <div class="action-group">
                    <button type="button" class="btn-icon btn-clear" id="clearBtn"></button>
                    <button type="button" class="btn-text" id="pasteBtn">Paste</button>
                    <button type="button" class="btn-icon"></button>
                    <button type="button" class="btn-icon">⊞</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="label">Destination network</label>
            <div class="network-pill">
                <div class="network-icon">⬡</div>
                <span>Tron (TRC-20)</span>
                <span class="dropdown-arrow">▼</span>
            </div>
        </div>

        <div class="form-group">
            <label class="label">Amount</label>
            <div class="amount-row">
                <input type="number" class="amount-input" id="amount" placeholder="0" step="0.000001" min="0">
                <div class="amount-right">
                    <span class="currency-label">USDT</span>
                    <button type="button" class="btn-text" id="maxBtn">Max</button>
                </div>
            </div>
            <span class="fiat-subtext" id="fiatValue">≈ $0.00</span>
        </div>
    </div>

    <div class="next-btn-container">
        <button type="button" class="next-btn" id="nextBtn">Next</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
